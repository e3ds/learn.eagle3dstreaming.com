<!-- [E3DS-LEARN-TEMPLATE] The shell every generated page is poured into.
     Edit this once and all pages follow on the next `node build.js`.
     Placeholders: {{title}} {{description}} {{nav}} {{breadcrumbs}} {{h1}}
                   {{content}} {{children}} {{source}} -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — Eagle 3D Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400&display=swap">
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://learn.eagle3dstreaming.com/wiki/{{slug}}">

<style>
  :root{
    --ground:#FAFBFA; --surface:#FFFFFF; --surface-2:#F1F4F3;
    --line:#DDE3E1; --ink:#141A19; --ink-2:#4A5654; --ink-3:#737F7D;
    --accent:#176B6B; --measure:68ch; --r:3px;
    --note:#1E6A8D; --note-bg:#EDF5F9; --tip:#1F6B4A; --tip-bg:#ECF6F1;
    --warn:#8A5A00; --warn-bg:#FBF3E2;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0F1413; --surface:#161C1B; --surface-2:#1D2524;
      --line:#2A3433; --ink:#E8EEEC; --ink-2:#A8B4B2; --ink-3:#7C8886;
      --accent:#5FC2BC;
      --note:#6FB6D8; --note-bg:#12212A; --tip:#6FC79C; --tip-bg:#0F2119;
      --warn:#DBA84E; --warn-bg:#231C0E;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F1413; --surface:#161C1B; --surface-2:#1D2524;
    --line:#2A3433; --ink:#E8EEEC; --ink-2:#A8B4B2; --ink-3:#7C8886;
    --accent:#5FC2BC;
    --note:#6FB6D8; --note-bg:#12212A; --tip:#6FC79C; --tip-bg:#0F2119;
    --warn:#DBA84E; --warn-bg:#231C0E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.65;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:820px;padding:44px 30px 100px;margin:0}
  a{color:var(--accent)}

  .crumbs{font-family:Archivo,Arial,sans-serif;font-size:13px;color:var(--ink-3);
    margin:0 0 18px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .crumbs a{color:var(--ink-3);text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .crumbs span{opacity:.5}

  h1{font-family:Archivo,Arial,sans-serif;font-weight:700;
    font-size:clamp(28px,4.4vw,38px);line-height:1.12;letter-spacing:-.02em;
    margin:0 0 28px;text-wrap:balance}
  h2{font-family:Archivo,Arial,sans-serif;font-weight:600;font-size:23px;
    line-height:1.25;margin:44px 0 12px;text-wrap:balance}
  h3{font-family:Archivo,Arial,sans-serif;font-weight:600;font-size:19px;
    margin:32px 0 10px}
  h4{font-family:Archivo,Arial,sans-serif;font-weight:600;font-size:16px;
    margin:26px 0 8px}
  p,li{max-width:var(--measure)}
  p{margin:0 0 16px}
  ul,ol{padding-left:24px}
  li{margin-bottom:7px}
  hr{border:none;border-top:1px solid var(--line);margin:34px 0}
  strong{font-weight:600}

  /* Pictures: the box holds its shape before the image lands, so text below
     does not jump while the page loads. */
  figure{margin:30px 0}
  figure img,p img{display:block;max-width:100%;height:auto;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
  figcaption{margin-top:9px;font-family:Archivo,Arial,sans-serif;font-size:14px;
    line-height:1.45;color:var(--ink-3)}

  /* Callouts carry their meaning in a coloured rail rather than a filled box,
     so a page with several of them does not turn into a patchwork. */
  .callout{margin:24px 0;padding:14px 18px;border-left:3px solid var(--note);
    background:var(--note-bg);border-radius:0 var(--r) var(--r) 0}
  .callout p:last-child{margin-bottom:0}
  .callout.tip{border-left-color:var(--tip);background:var(--tip-bg)}
  .callout.warning{border-left-color:var(--warn);background:var(--warn-bg)}

  code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em;
    background:var(--surface-2);padding:2px 5px;border-radius:3px}
  pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;overflow-x:auto;margin:22px 0}
  pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}

  /* A wide table scrolls inside its own box. Without this the page body
     scrolls sideways and every line of text becomes hard to follow. */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:24px 0;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-family:Archivo,Arial,sans-serif;
    font-size:14.5px}
  th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);
    padding:11px 14px;border-bottom:1px solid var(--line)}
  td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  td p:last-child,th p:last-child{margin-bottom:0}
  tr:last-child td{border-bottom:none}

  .children{margin:36px 0 0;padding:0;list-style:none;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .children a{display:block;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--ink);
    font-family:Archivo,Arial,sans-serif;font-size:15px;font-weight:500}
  .children a:hover{border-color:var(--accent);color:var(--accent)}
  .children-head{font-family:Archivo,Arial,sans-serif;font-weight:600;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    margin:48px 0 0;padding-bottom:9px;border-bottom:1px solid var(--line)}

  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);
    font-family:Archivo,Arial,sans-serif;font-size:13px;color:var(--ink-3)}
  footer a{color:var(--ink-3)}

  /* ---- the tree down the left ---------------------------------------- */
  /* The white areas. `html` had NO background of its own, so anywhere the
     body's background did not reach, what showed through was the browser's
     default canvas - white, in a dark page. Painting the root as well closes
     that gap for good, and min-height stops a short page leaving the lower part
     of the screen unpainted. Cheap, and it removes a whole class of bug rather
     than one instance of it. */
  html { background: var(--ground); }
  body { min-height: 100vh; background: var(--ground); }
  body{display:flex;align-items:flex-start}
  #e3dsNav{flex:0 0 286px;width:286px;position:sticky;top:0;height:100vh;
    overflow-y:auto;border-right:1px solid var(--line);background:var(--surface)}
  .e3dsNavInner{padding:22px 12px 60px}
  .e3dsNavHome{display:block;font-family:Archivo,Arial,sans-serif;font-weight:700;
    font-size:14px;margin:0 8px 16px;text-decoration:none;color:var(--ink)}
  .e3dsNavRoot,#e3dsNav ul{list-style:none;margin:0;padding:0}
  #e3dsNav ul ul{padding-left:13px;border-left:1px solid var(--line);margin-left:9px}
  #e3dsNav a{display:block;padding:5px 8px;border-radius:4px;font-size:14px;
    line-height:1.35;text-decoration:none;color:var(--ink-2);
    font-family:Archivo,Arial,sans-serif}
  #e3dsNav a:hover{background:var(--surface-2);color:var(--ink)}
  /* The page being read gets a rail as well as colour - colour alone is easy
     to lose halfway down a tree this long. */
  #e3dsNav a.on{color:var(--accent);font-weight:600;background:var(--surface-2);
    box-shadow:inset 2px 0 0 var(--accent)}
  .e3dsNavSec>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start}
  .e3dsNavSec>summary::-webkit-details-marker{display:none}
  .e3dsNavSec>summary::before{content:"\25B8";flex:0 0 auto;margin:7px 1px 0 0;
    font-size:9px;color:var(--ink-3);transition:transform .12s}
  .e3dsNavSec[open]>summary::before{transform:rotate(90deg)}
  .e3dsNavSec>summary>a{flex:1;min-width:0}

  #e3dsNavToggle{display:none}
  /* Narrower than this the tree would take most of the screen, so it becomes a
     drawer instead of a column. */
  @media (max-width:760px){
    body{display:block}
    .wrap{max-width:none;padding:30px 20px 90px}
    #e3dsNav{position:fixed;left:0;top:0;z-index:9998;transform:translateX(-100%);
      transition:transform .18s;box-shadow:2px 0 18px rgba(0,0,0,.35)}
    body.e3dsNavOpen #e3dsNav{transform:none}
    #e3dsNavToggle{display:block;position:fixed;left:12px;bottom:12px;z-index:9999;
      padding:10px 15px;border-radius:8px;border:1px solid var(--line);
      background:var(--surface);color:var(--ink);
      font:15px Archivo,Arial,sans-serif;cursor:pointer}
  }
</style>

{{nav}}

<div class="wrap">
  {{breadcrumbs}}
  <h1>{{h1}}</h1>
  {{content}}
  {{children}}
  <footer>Eagle 3D Streaming</footer>
</div>
